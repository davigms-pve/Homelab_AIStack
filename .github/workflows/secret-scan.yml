name: secret scan

# CONTRIBUTING.md's Definition of Done bans real IPs, hostnames, tokens and
# serial numbers in filled examples — but nothing enforced it, and this repo
# is public and ships deliberately realistic values, which is exactly the
# condition under which a real one slips in unnoticed.
#
# Same principle as validate-blocks.yml: everything a machine can check, a
# machine checks. Hostnames and serials stay human review, because no script
# can tell `pve1` from somebody's real node name.
#
# Runs the same way locally:
#     bash .github/scripts/secret-scan.sh

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for credential shapes and out-of-range IPv4 literals
        run: bash .github/scripts/secret-scan.sh
